[package]
name = "twig"
version = "0.1.0"
edition = "2024"
description = "A Git implementation in Rust that reads and writes real Git repositories"
license = "MIT"
repository = "https://github.com/pMag11-alt/twig"
readme = "README.md"
keywords = ["git", "vcs", "version-control"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
libc = "0.2.191"
memmap2 = "0.9.12"
sha1_smol = "1.0.1"
ureq = "3.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
